services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./public:/srv/public:ro
      - ./docker/nginx/vhosts:/etc/nginx/conf.d:ro

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      - db
    volumes:
      - ./:/srv/
    environment:
      PHP_DATE_TIMEZONE: UTC
    command: [ 'php-fpm' ]

  # Free, self-hostable relational database — no managed/paid database service.
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
    volumes:
      - db-data:/var/lib/mysql

  # Catches every outgoing e-mail locally — no third-party mail-sending SaaS needed for dev.
  mailer:
    image: axllent/mailpit:latest

  # Optional: swap MESSENGER_TRANSPORT_DSN to amqp://guest:guest@rabbitmq:5672/%2f/messages and
  # `docker compose --profile broker up` to run Messenger against a real broker instead of the
  # default Doctrine transport — a free, self-hostable alternative to a managed message queue.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [ broker ]
    ports:
      - '15672:15672'

volumes:
  db-data: ~
