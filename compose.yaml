services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./public:/srv/public:ro
      - ./docker/nginx/vhosts:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/srv/
    command: [ 'php-fpm' ]

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'healthcheck.sh', '--connect', '--innodb_initialized' ]
      interval: 2s
      timeout: 1s
      retries: 30

  mailer:
    image: axllent/mailpit:v1.29.3

  # Fake Acme/Globex vendor APIs + Globex checkout page.
  sandbox:
    build:
      context: docker/sandbox
    networks:
      default:
        aliases:
          - acme-api
          - globex-api
    volumes:
      - ./sandbox:/var/www/sandbox

volumes:
  db-data: ~
