deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # --- Bounded Contexts ---
    - name: Sales.Customer
      collectors:
        - { type: directory, value: 'src/Sales/Customer/.*' }

    - name: Sales.Order
      collectors:
        - { type: directory, value: 'src/Sales/Order/.*' }

    - name: Fulfilment.Shipment
      collectors:
        - { type: directory, value: 'src/Fulfilment/Shipment/.*' }

    - name: Iam.Identity
      collectors:
        - { type: directory, value: 'src/Iam/Identity/.*' }

    - name: Iam.Access
      collectors:
        - { type: directory, value: 'src/Iam/Access/.*' }

    - name: Catalog.Product
      collectors:
        - { type: directory, value: 'src/Catalog/Product/.*' }

    # --- Global ---
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Defines Vendors as "any non-project code" to handle PHP native classes and external libs.
          # Explicit exclusions (apps/, demo/...) prevent false positives when imported by other Deptrac scopes.
          # WARNING: BC access to Vendors is heavily restricted by Tools\PHPat\BoundedContextTest (Delivery vendors are forbidden).
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }

  # Deptrac broadly allows upstream BC access (e.g. Order -> Customer).
  # Domain Events leaking across BCs is explicitly forbidden by Tools\PHPat\DomainEventTest
  # (Integration Events must be used instead).
  ruleset:
    Sales.Customer:      [ Shared, Vendors ]
    Sales.Order:         [ Sales.Customer, Catalog.Product, Shared, Vendors ]
    Fulfilment.Shipment: [ Sales.Order, Shared, Vendors ]
    Iam.Identity:        [ Shared, Vendors ]
    Iam.Access:          [ Shared, Vendors ]
    Catalog.Product:     [ Shared, Vendors ]
    Shared:              [ Vendors ]
