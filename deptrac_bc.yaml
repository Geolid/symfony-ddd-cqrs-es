deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # --- Bounded Contexts ---
    - name: Sales.Customer
      collectors:
        - { type: directory, value: 'src/Sales/Customer/.*' }

    - name: Sales.Order
      collectors:
        - { type: directory, value: 'src/Sales/Order/.*' }

    - name: Fulfilment.Shipment
      collectors:
        - { type: directory, value: 'src/Fulfilment/Shipment/.*' }

    - name: Iam.Identity
      collectors:
        - { type: directory, value: 'src/Iam/Identity/.*' }

    - name: Iam.Access
      collectors:
        - { type: directory, value: 'src/Iam/Access/.*' }

    # --- Global ---
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Everything project-side is excluded: apps/ because this file is imported by
          # deptrac_dm.yaml (its scope), the rest so a src/ leak stays uncovered, never "vendor".
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }

  # Sanctioned cross-BC edges, both on a public Integration Event contract only — never on
  # another BC's Domain or Application internals:
  #   Sales.Order -> Sales.Customer       resolving the buyer behind a placed order
  #   Fulfilment.Shipment -> Sales.Order  the Processor reacting to a placed order and the Reducer
  #                                       folding that order onto the Shipment row
  # Fulfilment knows a single upstream contract, the order — everything it needs travels on it.
  # Iam.Access and Iam.Identity stay fully isolated from each other: a Grant only ever carries the
  # identity it applies to as a plain string, never resolves or verifies it.
  ruleset:
    Sales.Customer:      [ Shared, Vendors ]
    Sales.Order:         [ Sales.Customer, Shared, Vendors ]
    Fulfilment.Shipment: [ Sales.Order, Shared, Vendors ]
    Iam.Identity:        [ Shared, Vendors ]
    Iam.Access:          [ Shared, Vendors ]
    Shared:              [ Vendors ]
