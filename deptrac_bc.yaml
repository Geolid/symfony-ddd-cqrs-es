deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # Bounded Contexts
    - name: Sales.Customer
      collectors:
        - { type: directory, value: 'src/Sales/Customer/.*' }

    - name: Sales.Order
      collectors:
        - { type: directory, value: 'src/Sales/Order/.*' }

    - name: Sales.OrderSummary
      collectors:
        - { type: directory, value: 'src/Sales/OrderSummary/.*' }

    - name: Fulfilment.Shipment
      collectors:
        - { type: directory, value: 'src/Fulfilment/Shipment/.*' }

    - name: Iam.Identity
      collectors:
        - { type: directory, value: 'src/Iam/Identity/.*' }

    - name: Iam.Access
      collectors:
        - { type: directory, value: 'src/Iam/Access/.*' }

    - name: Catalog.Product
      collectors:
        - { type: directory, value: 'src/Catalog/Product/.*' }

    # Global
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Vendors: non-project code only. Exclusions below avoid mislabeling other layers as Vendors.
          # WARNING: BC access to Vendors also restricted by Tools\PHPat\BoundedContextTest.
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }
            - { type: directory, value: 'ui/.*' }

  # Deptrac draws which BC pairs may see each other; PHPat seals how (DomainEventTest, BoundedContextTest.onlyReachesAnotherBcThroughIntegrationEvents).
  ruleset:
    Sales.Customer:      [ Iam.Identity, Shared, Vendors ]
    Sales.Order:         [ Sales.Customer, Catalog.Product, Shared, Vendors ]
    Sales.OrderSummary:  [ Sales.Order, Fulfilment.Shipment, Shared, Vendors ]
    Fulfilment.Shipment: [ Sales.Order, Shared, Vendors ]
    Iam.Identity:        [ Shared, Vendors ]
    Iam.Access:          [ Iam.Identity, Shared, Vendors ]
    Catalog.Product:     [ Shared, Vendors ]
    Shared:              [ Vendors ]
