deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # --- Bounded Contexts ---
    - name: Sales.Order
      collectors:
        - { type: directory, value: 'src/Sales/Order/.*' }

    - name: Fulfilment.Shipment
      collectors:
        - { type: directory, value: 'src/Fulfilment/Shipment/.*' }

    # --- Global ---
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Everything project-side is excluded: apps/ because this file is imported by
          # deptrac_dm.yaml (its scope), the rest so a src/ leak stays uncovered, never "vendor".
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }

  # Fulfilment is allowed to depend on Sales ONLY for its public Integration Event contract
  # (Sales\Order\Application\Event\OrderPlacedIntegrationEvent) — see
  # Fulfilment\Shipment\Application\Processor\CreateShipmentOnOrderPlaced. This is the one
  # sanctioned cross-BC edge in this codebase, not a general license to reach into another BC's
  # Domain or Application layer.
  ruleset:
    Sales.Order:   [ Shared, Vendors ]
    Fulfilment.Shipment: [ Sales.Order, Shared, Vendors ]
    Shared:           [ Vendors ]
