deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # Bounded Contexts
    - name: Sales.Buyer
      collectors:
        - { type: directory, value: 'src/Sales/Buyer/.*' }

    - name: Sales.Ordering
      collectors:
        - { type: directory, value: 'src/Sales/Ordering/.*' }

    - name: Fulfilment.Shipping
      collectors:
        - { type: directory, value: 'src/Fulfilment/Shipping/.*' }

    - name: Finance.Payment
      collectors:
        - { type: directory, value: 'src/Finance/Payment/.*' }

    - name: Iam.Identity
      collectors:
        - { type: directory, value: 'src/Iam/Identity/.*' }

    - name: Iam.Authentication
      collectors:
        - { type: directory, value: 'src/Iam/Authentication/.*' }

    - name: Catalog.Listing
      collectors:
        - { type: directory, value: 'src/Catalog/Listing/.*' }

    - name: Compliance.Erasing
      collectors:
        - { type: directory, value: 'src/Compliance/Erasing/.*' }

    # Global
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Vendors: non-project code only. Exclusions below avoid mislabeling other layers as Vendors.
          # WARNING: BC access to Vendors also restricted by Tools\PHPat\BoundedContextTest.
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }
            - { type: directory, value: 'ui/.*' }

  # Deptrac draws which BC pairs may see each other; PHPat seals how (EventTest, BoundedContextTest.communicatesOnlyViaIntegrationEvents).
  ruleset:
    Sales.Buyer:      [ Iam.Identity, Compliance.Erasing, Shared, Vendors ]
    Sales.Ordering:         [ Sales.Buyer, Catalog.Listing, Fulfilment.Shipping, Finance.Payment, Shared, Vendors ]
    Fulfilment.Shipping: [ Sales.Ordering, Sales.Buyer, Finance.Payment, Shared, Vendors ]
    Finance.Payment: [ Sales.Ordering, Fulfilment.Shipping, Shared, Vendors ]
    Iam.Identity:        [ Compliance.Erasing, Shared, Vendors ]
    Iam.Authentication:  [ Iam.Identity, Shared, Vendors ]
    Catalog.Listing:     [ Shared, Vendors ]
    Compliance.Erasing:  [ Shared, Vendors ]
    Shared:              [ Vendors ]
