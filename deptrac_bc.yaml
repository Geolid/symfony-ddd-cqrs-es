deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # --- Bounded Contexts ---
    - name: Sales.Customer
      collectors:
        - { type: directory, value: 'src/Sales/Customer/.*' }

    - name: Sales.Order
      collectors:
        - { type: directory, value: 'src/Sales/Order/.*' }

    - name: Fulfilment.Shipment
      collectors:
        - { type: directory, value: 'src/Fulfilment/Shipment/.*' }

    # --- Global ---
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Everything project-side is excluded: apps/ because this file is imported by
          # deptrac_dm.yaml (its scope), the rest so a src/ leak stays uncovered, never "vendor".
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }

  # Fulfilment is allowed to depend on Sales ONLY for its public Integration Event contracts
  # (Sales\{Order,Customer}\Application\Event\*IntegrationEvent) — the Processor reacting to a
  # placed order, the Reducer folding the order total onto the Shipment row, and the Reducer
  # resolving the buyer's address before a delivery notification. These are the only sanctioned
  # cross-BC edges in this codebase, not a general license to reach into another BC's Domain or
  # Application layer.
  ruleset:
    Sales.Customer:      [ Shared, Vendors ]
    Sales.Order:         [ Shared, Vendors ]
    Fulfilment.Shipment: [ Sales.Customer, Sales.Order, Shared, Vendors ]
    Shared:              [ Vendors ]
