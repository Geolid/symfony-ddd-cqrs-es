deptrac:
  paths: [ ./src ]
  cache_file: var/.deptrac_bc.cache

  layers:
    # --- Bounded Contexts ---
    - name: Ordering.Order
      collectors:
        - { type: directory, value: 'src/Ordering/Order/.*' }

    - name: Shipping.Shipment
      collectors:
        - { type: directory, value: 'src/Shipping/Shipment/.*' }

    # --- Global ---
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

    - name: Vendors
      collectors:
        - type: bool
          # Everything project-side is excluded: apps/ because this file is imported by
          # deptrac_dm.yaml (its scope), the rest so a src/ leak stays uncovered, never "vendor".
          must_not:
            - { type: directory, value: 'src/.*' }
            - { type: directory, value: 'apps/.*' }
            - { type: directory, value: 'demo/.*' }
            - { type: directory, value: 'tools/.*' }
            - { type: directory, value: 'bin/.*' }

  # Shipping is allowed to depend on Ordering ONLY for its public Integration Event contract
  # (Ordering\Order\Application\Event\OrderPlacedIntegrationEvent) — see
  # Shipping\Shipment\Application\Processor\CreateShipmentOnOrderPlaced. This is the one
  # sanctioned cross-BC edge in this codebase, not a general license to reach into another BC's
  # Domain or Application layer.
  ruleset:
    Ordering.Order:   [ Shared, Vendors ]
    Shipping.Shipment: [ Ordering.Order, Shared, Vendors ]
    Shared:           [ Vendors ]
