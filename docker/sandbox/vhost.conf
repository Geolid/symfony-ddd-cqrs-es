<VirtualHost *:80>
    ServerName api.acme.test
    DocumentRoot /var/www/sandbox/acme/api

    <Directory /var/www/sandbox/acme/api>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName api.globex.test
    DocumentRoot /var/www/sandbox/globex/api

    <Directory /var/www/sandbox/globex/api>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName checkout.globex.localhost
    DocumentRoot /var/www/sandbox/globex/checkout

    <Directory /var/www/sandbox/globex/checkout>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
