<VirtualHost *:80>
    ServerName acme-api
    DocumentRoot /var/www/sandbox/acme/api

    <Directory /var/www/sandbox/acme/api>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName globex-api
    DocumentRoot /var/www/sandbox/globex/api

    <Directory /var/www/sandbox/globex/api>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/sandbox/globex/checkout

    <Directory /var/www/sandbox/globex/checkout>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
