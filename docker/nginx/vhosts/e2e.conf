# Real HTTP target for `castor qa:e2e` (Behat + Playwright's real browser) — a fixed
# port instead of the /<app_id>/ path convention, so APP_ENV/APP_ID stay hardcoded and
# no path-stripping is needed. php-fpm (not `php -S`) so the page's parallel asset
# requests (CSS/JS) don't get dropped under a real browser.
server {
    listen 8100;

    root /srv/public;

    client_max_body_size 10M;
    charset utf-8;

    location / {
        try_files $uri @app_fastcgi;
    }

    location @app_fastcgi {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param APP_ENV e2e;
        fastcgi_param APP_ID storefront;
    }
}
