# Routes /<app_id>/... to public/index.php with APP_ID from the path — local convenience, prod would split per DM.
map $app_path $stripped_uri {
    ""      "/";
    default $app_path;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /srv/public;

    client_max_body_size 10M;
    charset utf-8;

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>Showcase: DDD, CQRS and Event Sourcing architecture with Symfony</h1><ul><li><a href="/web/">web</a> — customer UI: register, log in, place &amp; track orders</li><li><a href="/api/">api</a> — JSON API for orders, products, shipments</li><li><a href="/webhook/docs">webhook</a> — inbound carrier &amp; payment webhooks</li><li><a href="/es-admin/">es-admin</a> — event store browser</li><li>cli — no HTTP surface, run via <code>bin/console --appId=cli</code></li></ul></body></html>';
    }

    location /favicon.ico {
        try_files $uri =404;
    }

    location ~ ^/(?<app_id>[^/]+)(?<app_path>/.*)?$ {
        if ($request_method = OPTIONS) {
            add_header "Access-Control-Allow-Origin" * always;
            add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, HEAD, DELETE, PUT, PATCH";
            add_header "Access-Control-Allow-Headers" "Authorization, Origin, X-Requested-With, Content-Type, Accept";
            add_header "Access-Control-Max-Age" 1728000;
            add_header "Content-Type" "text/plain; charset=utf-8";
            add_header "Content-Length" 0;
            return 204;
        }

        add_header "Access-Control-Allow-Origin" * always;

        try_files $stripped_uri @app_fastcgi;
    }

    location @app_fastcgi {
        add_header "Access-Control-Allow-Origin" * always;

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param REQUEST_URI $stripped_uri$is_args$args;
        fastcgi_param APP_ID $app_id;
        fastcgi_param HTTP_X_FORWARDED_PREFIX /$app_id;
    }
}
