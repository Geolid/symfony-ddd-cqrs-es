imports:
  - deptrac_bc.yaml

deptrac:
  paths: [ ./apps ]
  exclude_files:
    - '#.*/tests/.*#'
  cache_file: var/.deptrac_dm.cache

  layers:
    # --- Delivery Mechanisms ---
    - name: Web
      collectors:
        - { type: directory, value: 'apps/web/.*' }

    - name: Api
      collectors:
        - { type: directory, value: 'apps/api/.*' }

    - name: Cli
      collectors:
        - { type: directory, value: 'apps/cli/.*' }

    - name: Webhook
      collectors:
        - { type: directory, value: 'apps/webhook/.*' }

  # Which BC each DM may reach. What may be consumed *inside* a granted BC (only
  # #[AsDrivingPort] ports, Command/Query messages) is enforced separately by the phpat rule
  # Tools\PHPat\DeliveryMechanismTest — deptrac only draws the outer boundary.
  ruleset:
    Web:     [ Sales.Customer, Sales.Order, Catalog.Product, Fulfilment.Shipment, Iam.Identity, Iam.Access, Shared, Vendors ]
    Api:     [ Sales.Customer, Sales.Order, Catalog.Product, Fulfilment.Shipment, Iam.Identity, Iam.Access, Shared, Vendors ]
    Cli:     [ Sales.Customer, Sales.Order, Fulfilment.Shipment, Iam.Identity, Iam.Access, Shared, Vendors ]
    Webhook: [ Fulfilment.Shipment, Sales.Order, Shared, Vendors ]
