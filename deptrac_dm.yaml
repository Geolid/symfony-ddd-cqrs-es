imports:
  - deptrac_bc.yaml

deptrac:
  paths: [ ./apps, ./ui ]
  exclude_files:
    - '#.*/tests/.*#'
  cache_file: var/.deptrac_dm.cache

  layers:
    - name: Web
      collectors:
        - { type: directory, value: 'apps/web/.*' }

    - name: Api
      collectors:
        - { type: directory, value: 'apps/api/.*' }

    - name: Cli
      collectors:
        - { type: directory, value: 'apps/cli/.*' }

    - name: Webhook
      collectors:
        - { type: directory, value: 'apps/webhook/.*' }

    - name: EsAdmin
      collectors:
        - { type: directory, value: 'apps/es-admin/.*' }

    # Shared presentation (Twig Components) across DMs — never business logic.
    - name: Ui
      collectors:
        - { type: directory, value: 'ui/src/.*' }

  # Deptrac draws which BCs a Delivery Mechanism may see; PHPat seals how (DeliveryMechanismTest: through its own exposed surface only).
  ruleset:
    Web:     [ Sales.Buyer, Sales.Order, Sales.OrderSummary, Catalog.Listing, AfterSales.Return, Finance.Payment, Iam.Identity, Iam.Authentication, Shared, Vendors, Ui ]
    Api:     [ Sales.OrderSummary, Catalog.Listing, Iam.Identity, Iam.Authentication, Shared, Vendors ]
    Cli:     [ Sales.Buyer, Sales.Order, Fulfilment.Shipping, AfterSales.Return, Finance.Payment, Iam.Identity, Iam.Authentication, Shared, Vendors ]
    Webhook: [ Fulfilment.Shipping, Sales.Order, Finance.Payment, Shared, Vendors ]
    EsAdmin: [ Shared, Vendors ]
    # A Twig Component is presentation-only — framework/vendor glue, never a BC.
    Ui:      [ Vendors ]
