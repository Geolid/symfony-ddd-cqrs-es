imports:
  - deptrac_bc.yaml

deptrac:
  paths: [ ./apps, ./ui ]
  exclude_files:
    - '#.*/tests/.*#'
  cache_file: var/.deptrac_dm.cache

  layers:
    - name: Storefront
      collectors:
        - { type: directory, value: 'apps/storefront/.*' }

    - name: Api
      collectors:
        - { type: directory, value: 'apps/api/.*' }

    - name: Cli
      collectors:
        - { type: directory, value: 'apps/cli/.*' }

    - name: Webhook
      collectors:
        - { type: directory, value: 'apps/webhook/.*' }

    - name: EsDashboard
      collectors:
        - { type: directory, value: 'apps/es-dashboard/.*' }

    # Shared presentation (Twig Components) across DMs — never business logic.
    - name: Ui
      collectors:
        - { type: directory, value: 'ui/src/.*' }

  # Deptrac draws which BCs a Delivery Mechanism may see; PHPat seals how (DeliveryMechanismTest: through its own exposed surface only).
  ruleset:
    Storefront:   [ Iam.Identity, Iam.Authentication, Shared, Vendors ]
    Api:          [ Catalog.Listing, Iam.Identity, Iam.Authentication, Shared, Vendors ]
    Cli:          [ Shopping.Checkout, Sales.Ordering, Fulfilment.Shipping, Finance.Payment, Iam.Identity, Iam.Authentication, Shared, Vendors ]
    Webhook:      [ Fulfilment.Shipping, Sales.Ordering, Finance.Payment, Shared, Vendors ]
    EsDashboard:  [ Shared, Vendors ]

    # A Twig Component is presentation-only — framework/vendor glue, never a BC.
    Ui:           [ Vendors ]
