name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  TIER: ci
  APP_ENV: test
  EVENT_STORE_URL: mysql://root@127.0.0.1:3306/app_event_store?serverVersion=mariadb-11.8.0&charset=utf8mb4
  READ_MODEL_URL: mysql://root@127.0.0.1:3306/app_read_model?serverVersion=mariadb-11.8.0&charset=utf8mb4
  MESSENGER_URL: mysql://root@127.0.0.1:3306/app_messenger?serverVersion=mariadb-11.8.0&charset=utf8mb4

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-

      - name: make ci.build
        run: make ci.build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor
          path: |
            vendor
            ui/assets/vendor
          retention-days: 1

  static:
    name: Static analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vendor
          path: .

      - run: chmod -R +x vendor/bin

      - name: make ci.static
        run: make ci.static

  tests:
    name: Tests
    needs: static
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vendor
          path: .

      - run: chmod -R +x vendor/bin

      - name: make ci.test
        run: make ci.test

  mutation:
    name: Mutation testing
    needs: static
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vendor
          path: .

      - run: chmod -R +x vendor/bin

      - name: make ci.mutation
        run: make ci.mutation
