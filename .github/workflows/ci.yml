name: CI

# Mirrors platform's .circleci/config.yml build -> static -> {tests, mutation} pipeline: every
# stage runs through `make`, TIER=ci, never a raw vendor/bin/* call — the Makefile is the
# single source of truth for what "passing CI" means, locally or here. The release job mirrors
# dist-prod's `requires: [tests, mutation]` — a tag never publishes an artifact CI hasn't passed.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

env:
  TIER: ci
  APP_ENV: test
  # Present even in jobs with no MariaDB service (build/static) — Symfony resolves these env
  # vars while warming up the container even though nothing connects yet, same as platform's
  # CircleCI "static" executor (no database, same `make ci.static`).
  # The "null" transport never opens a socket — nothing in the test suite sends a real email
  # (NotifyCustomerOnShipmentDelivered is exercised with a stub notifier), so there's no Mailpit
  # to talk to here.
  MAILER_DSN: null://null
  EVENT_STORE_URL: mysql://root@127.0.0.1:3306/app_event_store?serverVersion=11.8-MariaDB&charset=utf8mb4
  READ_MODEL_URL: mysql://root@127.0.0.1:3306/app_read_model?serverVersion=11.8-MariaDB&charset=utf8mb4
  MESSENGER_URL: mysql://root@127.0.0.1:3306/app_messenger?serverVersion=11.8-MariaDB&charset=utf8mb4

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-

      - name: make ci.build
        run: make ci.build

      - uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor
          retention-days: 1

  static:
    name: Static analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: make ci.static
        run: make ci.static

  tests:
    name: Tests
    needs: static
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: make ci.test
        run: make ci.test

  mutation:
    name: Mutation testing
    needs: static
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: make mutation
        run: make mutation

  release:
    name: Build and publish release artifact
    needs: [ tests, mutation ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: make dist
        run: make dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
