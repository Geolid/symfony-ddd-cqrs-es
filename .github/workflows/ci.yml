name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  TIER: ci
  APP_ENV: test
  MAILER_DSN: null://null
  EVENT_STORE_URL: mysql://root@127.0.0.1:3306/app_event_store?serverVersion=11.8-MariaDB&charset=utf8mb4
  READ_MODEL_URL: mysql://root@127.0.0.1:3306/app_read_model?serverVersion=11.8-MariaDB&charset=utf8mb4
  MESSENGER_URL: mysql://root@127.0.0.1:3306/app_messenger?serverVersion=11.8-MariaDB&charset=utf8mb4

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-

      - name: make ci.build
        run: make ci.build

      - uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor
          retention-days: 1

  static:
    name: Static analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - run: chmod -R +x vendor/bin

      - name: make ci.static
        run: make ci.static

  tests:
    name: Tests
    needs: static
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - run: chmod -R +x vendor/bin

      - name: make ci.test
        run: make ci.test

  mutation:
    name: Mutation testing
    needs: static
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - run: chmod -R +x vendor/bin

      - name: make mutation
        run: make mutation
