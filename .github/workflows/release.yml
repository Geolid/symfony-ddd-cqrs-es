name: Release

on:
  push:
    tags:
      - 'v*'

env:
  TIER: ci
  APP_ENV: prod

jobs:
  release:
    name: Build and publish release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: make dist
        run: make dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
