name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_ENV: prod

jobs:
  release:
    name: Build and publish release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2, castor
          coverage: none

      - name: castor release:dist
        run: castor release:dist

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
