name: Release

# GitHub-native replacement for platform's tag-triggered CircleCI `dist-prod` job (which
# uploaded a tarball to a private AWS S3 bucket via `tarreleaser` — see the SaaS substitutions
# in the README): tag a commit `vX.Y.Z`, `make dist` builds the same production-optimized
# artifact, and it's attached directly to a GitHub Release. No cloud storage account needed.
#
# Doesn't rerun tests/static analysis: a tag is expected to point at a commit on main, and
# branch protection on main already requires the CI workflow to pass before a PR merges there.
# This job only packages what's already been verified.

on:
  push:
    tags:
      - 'v*'

env:
  TIER: ci
  APP_ENV: prod

jobs:
  release:
    name: Build and publish release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: make dist
        run: make dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
